name: fixture3-install-release

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - production

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish dry run
        run: cargo publish --dry-run --manifest-path apps/fixture3-install/crates/fixture3-install/Cargo.toml
      - name: Release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
          manifest_path: apps/fixture3-install/Cargo.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
