[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first }}
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false

[[git.commit_parsers]]
message = "^feat"
group = "features"

[[git.commit_parsers]]
message = "^fix"
group = "fixes"

[[git.commit_parsers]]
message = "^doc"
group = "documentation"

[[git.commit_parsers]]
message = "^perf"
group = "performance"

[[git.commit_parsers]]
message = "^refactor"
group = "refactoring"

[[git.commit_parsers]]
message = "^style"
group = "style"

[[git.commit_parsers]]
message = "^test"
group = "tests"

[[git.commit_parsers]]
message = "^chore"
group = "chores"
