name: Feature request
description: Propose a new fixture3 command, flag, or manifest field
labels: ["feature-request"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is awkward or impossible today? What forced you to work around fixture3?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What command, flag, manifest field, or behavior change would solve it? Include argv shape and exit-code semantics if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other shapes you considered and why this one is preferred.
  - type: input
    id: scope
    attributes:
      label: Scope
      description: command, flag, manifest, output format, reducer, doctor, or other
