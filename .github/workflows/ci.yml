name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Verify manifest layers
        run: |
          python3 scripts/verify-manifest.py tree
          python3 scripts/verify-manifest.py forbidden
          python3 scripts/verify-manifest.py config
          python3 scripts/verify-manifest.py modules
          python3 scripts/verify-manifest.py cli
      - name: Verify Rust
        run: |
          python3 scripts/verify-rust-workspaces.py --fmt
          python3 scripts/verify-rust-workspaces.py --check
          python3 scripts/verify-rust-workspaces.py --clippy
      - name: Verify fixture3 self suite
        run: cargo run --manifest-path apps/fixtures/Cargo.toml -p fixture3-cli -- check --suite self --manifest fixture3.yaml
      - name: Verify DDMin
        run: scripts/verify-ddmin.sh
      - name: Build DDMin docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --manifest-path packages/ddmin/Cargo.toml -p fixture3-ddmin
      - name: Stub package dry run
        run: cargo publish --dry-run --manifest-path apps/fixture3-install/crates/fixture3-install/Cargo.toml
      - name: DDMin package dry run
        run: cargo publish --dry-run --manifest-path packages/ddmin/crates/ddmin/Cargo.toml
