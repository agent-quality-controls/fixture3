[[cli_command]]
name = "reduce"
required_flags = ["--suite", "--fixture-root", "--work-dir"]
optional_flags = ["--manifest", "--max-oracle-calls", "--reducers"]
help_contains = [
  "--reducers",
  "dirs,files",
  "dirs",
  "files",
  "directory subtrees",
  "file candidates",
  "shared oracle-call budget",
]

[[manifest_contains]]
file = "README.md"
contains = [
  "--reducers dirs,files",
  "--reducers dirs",
  "--reducers files",
  "directory subtrees",
]

[[command]]
name = "reducer-verifier"
argv = ["python3", "scripts/verify-reducer.py"]
