[[cli_command]]
name = "reduce"
required_flags = ["--suite", "--fixture-root", "--work-dir"]
optional_flags = ["--manifest", "--max-oracle-calls"]
help_contains = [
  "Minimize copied fixture trees",
  "preserves the selected suite's approved output",
  "never edits --fixture-root directly",
  "reduce-report.json",
  "best/reduce-report.json",
  "removed-files.txt",
  "remaining-files.txt",
  "trial-current",
]

[[manifest_contains]]
file = "apps/fixtures/crates/fixture3/Cargo.toml"
contains = ["fixture3-ddmin"]

[[command]]
name = "reducer-verifier"
argv = ["python3", "scripts/verify-reducer.py"]
