[[workspace_member]]
workspace = "packages/ddmin/Cargo.toml"
member = "crates/ddmin"

[package]
workspace = "packages/ddmin/Cargo.toml"
path = "packages/ddmin/crates/ddmin/Cargo.toml"
name = "fixture3-ddmin"
license = "MIT OR Apache-2.0"
publish = true
readme = "README.md"
description = "Sequential DDMin reducer for ordered candidate lists"
include = ["src/**", "examples/**", "Cargo.toml", "README.md", "LICENSE*"]
docs_rs_all_features = true

[public_api]
crate_path = "packages/ddmin/crates/ddmin/src/lib.rs"
types = [
  "DdminInput",
  "DdminOptions",
  "OracleOutcome",
  "UnresolvedReason",
  "DdminOracle",
  "DdminOutput",
  "DdminStats",
  "DdminGuarantee",
  "DdminStopReason",
]
functions = ["ddmin"]

[[closed_set]]
kind = "enum"
type = "OracleOutcome"
variants = ["Interesting", "NotInteresting", "Unresolved"]

[[closed_set]]
kind = "enum"
type = "UnresolvedReason"
variants = [
  "Timeout",
  "MaterializationFailed",
  "OracleFailed",
  "InvalidCandidateSet",
  "NonDeterministic",
]

[[closed_set]]
kind = "enum"
type = "DdminGuarantee"
variants = ["OneMinimalWithinCandidateSet", "Incomplete"]

[[closed_set]]
kind = "enum"
type = "DdminStopReason"
variants = ["MaxOracleCallsReached", "BaselineNotInteresting"]

[[command]]
name = "contract-cases"
argv = ["python3", "packages/ddmin/scripts/run-contract-cases.py"]

[[command]]
name = "reference-differential"
argv = ["python3", "packages/ddmin/scripts/run-reference-differential.py"]
